name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://lexranked.com

  research-worker:
    name: Research worker (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/research/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  wordpress-plugin:
    name: WordPress plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: wordpress/plugins/lexranked-core
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer test

  wordpress-integration:
    name: End-to-end (WordPress + worker + Next.js)
    runs-on: ubuntu-latest
    needs: [wordpress-plugin, frontend, research-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            workers/research/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: workers/research
      - name: API + research worker + rendered-page assertions against the packaged plugin
        run: scripts/wp-integration-test.sh --frontend
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lexranked-core-plugin
          path: dist/lexranked-core-*.zip
          if-no-files-found: error

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no env files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::Environment files must not be committed."
            exit 1
          fi
